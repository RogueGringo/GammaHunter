[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gammahunter"
version = "0.1.0"
description = "Proprietary measurement harness comparing iterative and fixed-depth sequence models on multi-step graph reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "B.Jones", email = "B.Jones@jtech.ai" }]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
torch = ["torch"]
benchmarks = ["pyarrow"]

[project.scripts]
reachability-gen = "reachability_gen.generate:main"
reachability-overfit-ff = "reachability_gen.overfit_ff:main"
reachability-overfit-geo = "reachability_gen.overfit_geo:main"
reachability-train-ff-id = "reachability_gen.train_ff_id:main"
reachability-id-2k-comparison = "reachability_gen.run_id_2k_comparison:main"
reachability-id-2k-rematch = "reachability_gen.run_id_2k_rematch:main"
reachability-id-2k-rematch-fixed30 = "reachability_gen.run_id_2k_rematch_fixed30:main"
reachability-id-2k-rematch-bound30 = "reachability_gen.run_id_2k_rematch_bound30:main"
reachability-gen-ood-hops = "reachability_gen.gen_ood_hops:main"
reachability-ood-gate2 = "reachability_gen.run_ood_gate2:main"
reachability-gen-covariate-matched-ood = "reachability_gen.gen_covariate_matched_ood:main"
reachability-ood-covariate-matched = "reachability_gen.run_covariate_matched_ood:main"
reachability-audit-checkpoints = "reachability_gen.audit_checkpoints:main"
reachability-gen-id-disjoint = "reachability_gen.gen_id_disjoint:main"
reachability-disjoint-rematch = "reachability_gen.run_disjoint_rematch:main"
reachability-nlgraph = "reachability_gen.benchmarks.nlgraph:main"
reachability-mp-calibration = "reachability_gen.run_mp_calibration:main"
reachability-reach-cues = "reachability_gen.reach_cues:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: longer training / overfit checks (deselect with -m 'not slow')",
]
